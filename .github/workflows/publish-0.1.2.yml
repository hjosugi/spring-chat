name: Publish the validated spring-chat 0.1.2 bundle

on: workflow_dispatch
permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: central
    timeout-minutes: 6
    steps:
      - name: Check the deployment and publish it to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import http.client
          import json
          import os
          import time

          deployment = "5c1db7a0-eb09-472d-abcd-3c7ecd5bb211"
          modules = ("spring-chat-parent", "spring-chat-spring-boot-autoconfigure",
                     "spring-chat-spring-boot-starter", "spring-chat-kotlin")
          expected = {f"pkg:maven/io.github.hjosugi/{module}@0.1.2" for module in modules}
          credentials = os.environ["CENTRAL_TOKEN_USERNAME"] + ":" + os.environ["CENTRAL_TOKEN_PASSWORD"]
          headers = {
              "User-Agent": "spring-chat-release/0.1.2 (+https://github.com/hjosugi/spring-chat)",
              "Accept": "application/json",
              "Authorization": "Bearer " + base64.b64encode(credentials.encode()).decode(),
          }

          def post(path):
              conn = http.client.HTTPSConnection("central.sonatype.com", timeout=30)
              try:
                  conn.request("POST", "/api/v1/publisher/" + path, body=b"", headers=headers)
                  response = conn.getresponse()
                  body = response.read()
                  if not 200 <= response.status < 300:
                      raise RuntimeError(f"Central returned HTTP {response.status} for {path}")
                  return body
              finally:
                  conn.close()

          for attempt in range(25):
              status = json.loads(post("status?id=" + deployment))
              if status.get("deploymentId") != deployment:
                  raise RuntimeError("Central returned a different deployment ID")
              state = status["deploymentState"]
              print(f"{deployment} {state}", flush=True)
              if state in ("VALIDATING", "PENDING"):
                  time.sleep(10)
                  continue
              if state not in ("VALIDATED", "PUBLISHING", "PUBLISHED"):
                  raise RuntimeError(f"Cannot publish a deployment in state {state}")
              if set(status.get("purls") or []) != expected:
                  raise RuntimeError(f"Unexpected release coordinates: {status.get('purls')}")
              print("\n".join(sorted(expected)), flush=True)
              if state == "VALIDATED":
                  post("deployment/" + deployment)
                  print("Maven Central accepted publication of 0.1.2", flush=True)
              break
          else:
              raise TimeoutError("Timed out while waiting for validation")
          PY

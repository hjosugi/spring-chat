<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  The chat. Include it where it should appear; it fills its container:

    <div style="height: 32rem" th:insert="~{spring-chat/chat :: chat}"></div>

  That one uses spring-chat.transport. To name the transport for one include:

    <div style="height: 32rem" th:insert="~{spring-chat/chat :: chat-over('websocket')}"></div>
*/-->
<!--/*
  Thymeleaf lets no bean into the expression of an insert or of a link,
  hence the variable that holds the springChat bean.
*/-->
<th:block th:fragment="chat" th:with="chat=${@springChat}">
    <th:block th:insert="~{spring-chat/chat :: chat-over(${chat.transport})}"></th:block>
</th:block>

<th:block th:fragment="chat-over(transport)" th:with="chat=${@springChat}">
    <link rel="stylesheet" th:href="@{/spring-chat/spring-chat.css}">
    <deep-chat class="spring-chat"
               th:data-transport="${transport}"
               th:data-stream-url="@{${chat.streamPath}}"
               th:data-socket-url="@{${chat.socketPath}}"
               th:data-intro="${chat.intro}"
               th:data-placeholder="${chat.placeholder}"
               th:data-interrupted="${chat.messages.interrupted}"
               th:data-unreachable="${chat.messages.unreachable}"
               th:data-refused="${chat.messages.refused}"
               th:data-truncated="${chat.messages.truncated}"
               th:data-filtered="${chat.messages.filtered}"
               th:data-empty="${chat.messages.empty}"
               th:data-confirm="${chat.messages.confirm}"
               th:data-allow="${chat.messages.allow}"
               th:data-deny="${chat.messages.deny}"
               th:data-tool-call="${chat.messages.toolCall}"
               th:data-attachment-error="${chat.messages.attachmentError}"
               th:data-attachments="${chat.attachments.enabled}"
               th:data-max-files="${chat.attachments.maxCount}"
               th:data-max-file-size="${chat.attachments.maxSize}"
               th:data-accepted-types="${chat.attachments.acceptedTypes}"
               th:data-csrf-header="${_csrf?.headerName}"
               th:data-csrf-token="${_csrf?.token}"></deep-chat>
    <script type="module" th:src="@{/webjars/deep-chat/dist/deepChat.bundle.js}"></script>
    <script type="module" th:src="@{/spring-chat/spring-chat.js}"></script>
</th:block>
</body>
</html>

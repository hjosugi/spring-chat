spring.application.name=spring-chat-sample-kotlin

# sse or websocket
spring-chat.transport=sse
spring-chat.title=Spring Chat
spring-chat.intro=Hello. Ask me anything.
spring-chat.system-prompt=You are a helpful assistant. Answer in the language of the question.

# Without a key the replies come from DemoChatModel. For Claude:
#   CHAT_MODEL=anthropic ANTHROPIC_API_KEY=... ./mvnw -pl spring-chat-sample-kotlin spring-boot:run
spring.ai.model.chat=${CHAT_MODEL:demo}
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.model=claude-opus-5-5
spring.ai.anthropic.chat.max-tokens=64000
